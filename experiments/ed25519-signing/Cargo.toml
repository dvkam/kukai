[package]
name = "wallet-ed25519-signing-experiment"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
blake2 = "=0.10.6"
frost-ed25519 = "=3.0.0"
rand_core = { version = "=0.6.4", features = ["getrandom"] }

[dev-dependencies]
solana-signature = { version = "=3.6.0", features = ["verify"] }
tezos_crypto_rs = { version = "=0.6.0", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
solana-signature = { version = "=3.6.0", features = ["verify"] }
tezos_crypto_rs = { version = "=0.6.0", default-features = false }
getrandom = { version = "=0.2.17", features = ["js"] }
getrandom04 = { package = "getrandom", version = "=0.4.3", features = ["wasm_js"] }
wasm-bindgen = "=0.2.108"
web-sys = { version = "=0.3.85", features = ["Window", "Performance"] }

[[test]]
name = "quorum"
path = "tests/quorum.rs"
