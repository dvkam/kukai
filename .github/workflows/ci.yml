name: CI

on:
  pull_request:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wallet:
    name: Wallet lint, typecheck, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Use HTTPS for the inherited Git dependency
        run: |
          git config --global url.https://github.com/.insteadOf git://github.com/
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
      - run: npm ci --no-audit --no-fund
        env:
          HUSKY: '0'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run test:ci-policy
      - run: npx eslint experiments/browser-prf/probe.js && npx tsc --project experiments/browser-prf/tsconfig.json

  program:
    name: PoC lint, typecheck, tests, and records
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - run: python -m pip install -r requirements-ci.txt
      - run: ruff check experiments/token_amounts experiments/web_limits experiments/library-build-check/run.py scripts/check-program-docs.py experiments/browser-prf/run.py experiments/ed25519-signing/browser/run.py tests
      - run: ruff check experiments/recovery-model/check.py experiments/ed25519-signing/exit/check.py experiments/secp256k1-signing/exit/check.py
      - run: pyright
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check-program-docs.py
      - run: python experiments/browser-prf/run.py
      - name: Check Solana fee payment with a zero-SOL token owner
        run: |
          python -m venv "${RUNNER_TEMP}/solana-fees"
          "${RUNNER_TEMP}/solana-fees/bin/python" -m pip install --only-binary=:all: --require-hashes -r experiments/solana-fees/requirements-linux-x86_64.txt
          ruff check experiments/solana-fees/check.py experiments/ed25519-signing/exit/check_sol.py
          pyright --pythonpath "${RUNNER_TEMP}/solana-fees/bin/python" experiments/solana-fees/check.py experiments/ed25519-signing/exit/check_sol.py
          "${RUNNER_TEMP}/solana-fees/bin/python" experiments/solana-fees/check.py
      - run: python experiments/recovery-model/check.py

  crypto-builds:
    name: Pinned crypto native and WASM builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.100.0 --profile minimal --target wasm32-unknown-unknown --component rustfmt --component clippy
      - run: python experiments/library-build-check/run.py --output "${RUNNER_TEMP}/library-build-check"
      - run: cargo +1.100.0 fmt --manifest-path experiments/ed25519-signing/Cargo.toml -- --check
      - run: cargo +1.100.0 clippy --manifest-path experiments/ed25519-signing/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo +1.100.0 test --manifest-path experiments/ed25519-signing/Cargo.toml --locked
      - run: python -m pip install -r requirements-ci.txt
      - run: bash experiments/ed25519-signing/browser/check.sh
      - name: Test retained Ed25519 shares without network access
        run: |
          cargo +1.100.0 build --locked --examples --manifest-path experiments/ed25519-signing/Cargo.toml
          parent_net=$(stat -Lc %i /proc/self/ns/net)
          sudo unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- "$(command -v python)" \
            experiments/ed25519-signing/exit/check.py experiments/ed25519-signing/target/debug/examples "$parent_net"
      - name: Execute retained-quorum SOL transfers without network access
        run: |
          python -m venv "${RUNNER_TEMP}/solana-exit"
          "${RUNNER_TEMP}/solana-exit/bin/python" -m pip install --only-binary=:all: --require-hashes -r experiments/solana-fees/requirements-linux-x86_64.txt
          parent_net=$(stat -Lc %i /proc/self/ns/net)
          sudo unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- "${RUNNER_TEMP}/solana-exit/bin/python" \
            experiments/ed25519-signing/exit/check_sol.py experiments/ed25519-signing/target/debug/examples --parent-net-inode "$parent_net"
      - run: cargo +1.100.0 fmt --manifest-path experiments/secp256k1-signing/Cargo.toml -- --check
      - run: cargo +1.100.0 clippy --release --manifest-path experiments/secp256k1-signing/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo +1.100.0 test --release --manifest-path experiments/secp256k1-signing/Cargo.toml --locked -- --nocapture
      - name: Test retained secp256k1 shares without network access
        run: |
          cargo +1.100.0 build --release --locked --examples --manifest-path experiments/secp256k1-signing/Cargo.toml
          parent_net=$(stat -Lc %i /proc/self/ns/net)
          sudo unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- "$(command -v python)" \
            experiments/secp256k1-signing/exit/check.py experiments/secp256k1-signing/target/release/examples --parent-net-inode "$parent_net"
      - run: cargo +1.100.0 fmt --manifest-path experiments/tz4-screen/Cargo.toml -- --check
      - run: cargo +1.100.0 clippy --manifest-path experiments/tz4-screen/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo +1.100.0 test --manifest-path experiments/tz4-screen/Cargo.toml --locked
