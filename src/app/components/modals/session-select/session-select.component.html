<dialog #dialog inert class="flex-column kukai-modal invoked-dialog account-selection-dialog" aria-labelledby="session-select-title"
  (cancel)="cancel($event)" (keydown.tab)="wrapFocus($event)" (keydown.shift.tab)="wrapFocus($event)">
  <div #content class="content">
    <div class="flex-row top">
      <button type="button" autofocus class="flex-row close" aria-label="Close" (click)="dismiss()">
        <img class="x" src="assets/img/close-btn-x.png" alt="" />
      </button>
      <h1 id="session-select-title" class="title">Change Session Account</h1>
    </div>
    <div class="seperator"></div>
    <div class="flex-column session-select">
      <app-ui-dropdown-permission-request [options]="accounts" [current]="selectedAccount"
        (dropdownResponse)="selectedAccount = $event"></app-ui-dropdown-permission-request>
      <div class="flex-column bottom">
        <div class="seperator"></div>
        <button type="button" class="blue confirm" [disabled]="!selectedAccount?.pk" (click)="changeAddress()">Confirm</button>
      </div>
    </div>
  </div>
</dialog>
