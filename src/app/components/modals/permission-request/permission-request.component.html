<dialog #dialog inert class="flex-column kukai-modal invoked-dialog account-selection-dialog" aria-labelledby="permission-request-title"
  aria-describedby="permission-request-transport permission-request-app permission-request-question" (cancel)="cancel($event)"
  (keydown.tab)="wrapFocus($event)" (keydown.shift.tab)="wrapFocus($event)">
  <div #content class="content">
    <div class="flex-row top">
      <button type="button" autofocus class="flex-row close" aria-label="Close" (click)="rejectPermissions()">
        <img class="x" src="assets/img/close-btn-x.png" alt="" />
      </button>
      <h1 id="permission-request-title" class="title">Connect</h1>
    </div>
    <div class="flex-column permission-request">
      <span id="permission-request-transport" class="transport">{{ permissionRequest?.version ? 'Beacon' : 'Wallet Connect' }}</span>
      <app-asset *ngIf="permissionRequest?.appMetadata?.icon as icon" class="app-icon" [assets]="{ displayAsset: icon }"></app-asset>
      <span id="permission-request-app" class="dapp-name">{{ permissionRequest?.appMetadata?.name }}</span>
      <span id="permission-request-question" class="question">Do you want to connect to<br>this app?</span>
      <h6>Apply To Account:</h6>
      <app-ui-dropdown-permission-request [options]="accounts" [current]="selectedAccount"
        (dropdownResponse)="selectedAccount = $event"></app-ui-dropdown-permission-request>
      <div class="flex-column bottom">
        <div class="seperator"></div>
        <button type="button" class="blue confirm" [disabled]="!selectedAccount?.pk" (click)="grantPermissions()">Connect</button>
      </div>
    </div>
  </div>
</dialog>
