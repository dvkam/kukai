<dialog #dialog inert class="flex-column kukai-modal invoked-dialog" aria-labelledby="receive-title" (cancel)="cancel($event)"
  (keydown.tab)="wrapFocus($event)" (keydown.shift.tab)="wrapFocus($event)">
  <div #content class="content">
    <div class="flex-row top">
      <button #closeButton autofocus type="button" class="flex-row close" aria-label="Close" (click)="closeModal()">
        <img class="x" src="assets/img/close-btn-x.png" alt="" />
      </button>
      <h1 id="receive-title" class="title">Receive Address</h1>
    </div>
    <div class="seperator"></div>
    <div class="flex-column receive">
      <p class="value qr-label">Your account QR code</p>
      <canvas #canvas aria-hidden="true"></canvas>
      <div class="flex-row value address">
        <span #address>{{ activeAddress }}</span>
        <button #copyButton type="button" class="copy" aria-label="Copy address" (click)="copy()">
          <img src="assets/img/copy-icon.svg" alt="" />
        </button>
      </div>
      <p class="copy-status" role="status">{{ copyStatus }}</p>
    </div>
  </div>
</dialog>
