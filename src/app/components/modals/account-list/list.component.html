<dialog #dialog inert class="flex-column invoked-dialog" aria-labelledby="account-list-title" (cancel)="cancel($event)"
  (keydown.tab)="wrapFocus($event)" (keydown.shift.tab)="wrapFocus($event)">
  <div #content class="content">
    <div class="top">
      <button #closeButton autofocus type="button" class="close" aria-label="Close" (click)="closeModal()">
        <img src="assets/img/close-btn-x.png" alt="" />
      </button>
      <h1 id="account-list-title">{{ title }}</h1>
    </div>
    <app-account-list-body [current]="activeAccount" (accountChosen)="closeModal()"></app-account-list-body>
  </div>
</dialog>
