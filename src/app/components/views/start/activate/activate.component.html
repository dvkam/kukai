<form autocomplete="off" (submit)="$event.preventDefault()">
  <div class="flex-column card">
    <a routerLink="/import/" [state]="{ option: 2 }" class="flex-row back back-link"><img
          src="../../../../../assets/img/left-arrow.svg" alt="">BACK</a>
    <div class="flex-column body">
      <h1>
        Activate a Fundraiser wallet
      </h1>
      <p class="description">Wallets created during the fundraiser need to be activated. No private key is required for
        the activation process.</p>
      <label class="description" for="activate-address">Your public key hash</label>
      <input id="activate-address" name="address" type="text" class="text" [(ngModel)]="pkh" placeholder="tz1..." aria-describedby="activation-error">
      <label class="description" for="activate-code">Your activation code</label>
      <input id="activate-code" name="activationCode" type="text" class="text" [(ngModel)]="secret" placeholder="Code" aria-describedby="activation-error">
      <button type="button" class="button next" (click)="activate()">Activate</button>
      <div id="activation-error" role="status" aria-atomic="true">
        <span *ngIf="formInvalid" class="description red">{{ formInvalid }}</span>
      </div>
    </div>
  </div>
</form>
