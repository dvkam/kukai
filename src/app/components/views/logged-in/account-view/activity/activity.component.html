<div class="selectable main-container">
  <div class="top-container-activity">
    <h1>Recent Activity</h1>
    <div class="right">
      <a class="view-all" href="{{ explorerURL(account.address) }}" target="_blank">View in Explorer</a>
      <!-- <img class="button icon" src="../../../../assets/img/info.svg" /> -->
    </div>
  </div>
  <div class="selectable" id="operations-container">
    <div role="status" [ngSwitch]="state">
      <div *ngSwitchCase="'loading'">Loading activity...</div>
      <div *ngSwitchCase="'empty'" class="line">No activity yet</div>
      <div *ngSwitchCase="'unavailable'">{{ refreshing ? 'Retrying activity...' : 'Recent activity is unavailable.' }}</div>
      <div *ngSwitchCase="'stale'">{{ refreshing ? 'Refreshing activity...' : 'Recent activity may be out of date.' }}</div>
    </div>
    <button
      *ngIf="state === 'unavailable' || state === 'stale'"
      class="activity-retry"
      type="button"
      [attr.aria-disabled]="refreshing ? 'true' : null"
      (click)="retry()"
    >
      Retry activity
    </button>
    <ng-container *ngFor="let activity of account.activities | slice:0:10; trackBy: trackEvent">
      <app-event [activity]="activity" [account]="account"></app-event>
    </ng-container>
  </div>
</div>
