<div class="flex-row dropdown" [class.expanded]="isOpen" [id]="ecmpId"
  (keydown.escape)="onEscape($event)" (focusout)="onFocusOut($event)">
  <button #trigger type="button" class="flex-row recipient-type-trigger"
    [attr.aria-label]="'Recipient type: ' + torusVerifierName" [attr.aria-expanded]="isOpen"
    aria-controls="prepare-send-recipient-types" (click)="toggleDropdown()">
    <img class="icon-torus" alt=""
      [src]="torusVerifier === '' ? 'assets/img/tezos-xtz-logo.svg' : 'assets/img/' + torusVerifier.toLowerCase() + '-logo.svg'" />
    <span class="trigger-text">{{ torusVerifierName }}</span>
    <img class="icon-db" src="assets/img/down-arrow.svg" alt="" />
  </button>
  <div id="prepare-send-recipient-types" class="flex-column dropdown-content" role="group" aria-label="Recipient types"
    [walletPanelTrigger]="trigger" [panelOpen]="isOpen">
    <button type="button" [class.selected]="torusVerifierName === 'Tezos Address'"
      [attr.aria-pressed]="torusVerifierName === 'Tezos Address'" (click)="select('', 'Tezos Address')">Tezos Address</button>
    <button type="button" *ngIf="!tezosDomains.unsupportedNetwork" [class.selected]="torusVerifierName === 'Tezos Domains'"
      [attr.aria-pressed]="torusVerifierName === 'Tezos Domains'" (click)="select('domain', 'Tezos Domains')">Tezos Domains</button>
    <ng-container *ngFor="let key of torusService.verifierMapKeys">
      <button type="button" *ngIf="torusService.verifierMap[key].lookups"
        [class.selected]="torusVerifierName === torusService.verifierMap[key].name"
        [attr.aria-pressed]="torusVerifierName === torusService.verifierMap[key].name"
        (click)="select(key, torusService.verifierMap[key].name)">{{ torusService.verifierMap[key].name }}</button>
    </ng-container>
  </div>
</div>
