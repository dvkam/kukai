<div class="hamburger-dropdown" [class.expanded]="isOpen" [id]="ecmpId">
  <button #panelTrigger type="button" class="menu-trigger" aria-label="Wallet navigation" [attr.aria-expanded]="isOpen"
    aria-controls="wallet-navigation-panel" (click)="toggleDropdown()"><img class="icon-db" alt="" src="../../../../assets/img/hamburger.svg" /></button>
  <div *ngIf="router.url.indexOf('/account/') === 0" id="wallet-navigation-panel" class="flex-column mobile dropdown-content" [walletPanelTrigger]="panelTrigger" [panelOpen]="isOpen">
    <div class="flex-row-wrap account-content">
      <button type="button" class="flex-column button" (click)="unlockableService.toggleFeature('theme', 'dark');returnToTrigger()">
        <div class="wrapper">
          <img alt="" class="icon" [src]="this.unlockableService?.unlockables?.theme === 'dark' ? 'assets/img/light_mode_blue.svg' : 'assets/img/dark_mode_blue.svg'" />
        </div>
        <span>THEME</span>
      </button>
      <button type="button" *ngIf="router.url.indexOf('/account/') === 0" class="flex-column button" (click)="copy();returnToTrigger()">
        <div class="wrapper">
          <img alt="" class="icon" src="../../../../assets/img/copy-blue.svg" />
        </div>
        <span>COPY</span>
      </button>
      <button #receiveTrigger type="button" class="flex-column button" aria-label="Receive address QR code" aria-haspopup="dialog"
        (click)="openReceive(receiveTrigger)">
        <div class="wrapper">
          <img alt="" class="icon" src="../../../../assets/img/qr-blue.svg" />
        </div>
        <span>QR</span>
      </button>
      <button type="button" *ngIf="walletService.isHdWallet() || walletService.isLedgerWallet()" class="flex-column button" (click)="newAccount();isOpen = false">
        <div class="wrapper">
          <img alt="" class="icon" src="../../../../assets/img/add-blue.svg" />
        </div>
        <span>ADD</span>
      </button>
    </div>
    <a *ngIf="!CONSTANTS.TEZOS_X" class="flex-row button delegation" routerLink="/account/{{activeAccount?.address}}/stakers"
      (click)="returnToTrigger()">
      <div *ngIf="!activeAccount?.delegate" class="flex-row">
        <span class="flex-row">DELEGATING:</span><span class="choose">NOT
          DELEGATING</span>
      </div>
      <div *ngIf="activeAccount?.delegate" class="flex-row">
        <span>DELEGATING:</span>
        <span class="flex-row address">{{ delegateName
          }}</span>
      </div>
    </a>

    <a class="flex-row button" [routerLink]="'/account/' + activeAccount?.address + '/settings'" (click)="returnToTrigger()">
      <span>SETTINGS</span><img alt="" class="icon settings" src="../../../../assets/img/cog.svg" style="width: 2.75rem" />
    </a>
    <button type="button" class="flex-row button" (click)="logout();isOpen = false">
      <span>LOGOUT</span><img alt="" class="icon" src="../../../../assets/img/sign-out-alt.svg" style="width: 2.5rem" />
    </button>
  </div>
  <div *ngIf="router.url.indexOf('/account/') !== 0" id="wallet-navigation-panel" class="flex-column mobile dropdown-content" [walletPanelTrigger]="panelTrigger" [panelOpen]="isOpen">
    <a routerLink="/import/" class="flex-row button" (click)="returnToTrigger()">
      <span>Import Wallet</span>
    </a>
    <a routerLink="/new-wallet/" class="flex-row button" (click)="followCreateWallet($event)">
      <span>Create New Wallet</span>
    </a>
    <a routerLink="/connect-ledger/" class="flex-row button" (click)="returnToTrigger()">
      <span>Connect Ledger</span>
    </a>
  </div>
</div>
