<div class="flex-row advanced">
  <button type="button" class="switch-container" role="switch" [attr.aria-label]="text"
    [attr.aria-checked]="state" [attr.aria-controls]="controls" (click)="toggle()">
    <span class="value" aria-hidden="true">{{ text }}</span>
    <span class="flex-row switch" aria-hidden="true">
      <span class="key">{{ state ? 'ON' : 'OFF' }}</span>
      <span class="slider" [class.active]="state"><span class="round"></span></span>
    </span>
  </button>
</div>
